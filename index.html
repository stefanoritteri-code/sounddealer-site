<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Dealer</title>
<meta name="description" content="Sound Dealer — we make noise with purpose.">
<style>
  :root{
    --bg:#0a0906;
    --fg:#ede7da;
    --dim:#8a8274;
    --amber:#ff9b3d;
    --amber-dark:#a45f1f;
    --amber-light:#ffd9a8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow-x:hidden;
  }

  /* ---------- loader ---------- */
  .loader{
    position:fixed; inset:0; z-index:20;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .loader-line{
    width:120px; height:1px; background:var(--dim);
    position:relative; overflow:hidden;
  }
  .loader-line::after{
    content:""; position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--fg);
    animation:loadfill 900ms cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes loadfill{ to{ width:100%; } }
  .loader.done{ opacity:0; visibility:hidden; }

  /* ---------- ambient ---------- */
  .noise{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    opacity:.035; mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
  .spotlight{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(640px circle at var(--x,50%) var(--y,10%), rgba(255,155,61,.10), transparent 62%);
  }

  /* ---------- corner tag ---------- */
  .tag{
    position:fixed; top:clamp(1.25rem,3vw,2rem); left:clamp(1.25rem,4vw,3rem); z-index:5;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dim);
  }

  /* ---------- stage / hero ---------- */
  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:6vw 5vw;
    perspective:1600px;
  }
  .hero{
    width:100%;
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }
  h1#wordmark{
    margin:0;
    width:100%;
    display:flex;
    flex-wrap:nowrap;
    white-space:nowrap;
    font-weight:800;
    letter-spacing:-0.03em;
    text-transform:uppercase;
    line-height:1;
    color:var(--fg);
    opacity:0;
    transition:opacity .8s ease;
  }
  .ch{
    position:relative;
    display:inline-block;
    transform-origin:50% 100%;
    will-change:transform;
  }
  .ch .base{
    position:relative;
    z-index:1;
    text-shadow:
      0.01em 0.01em 0 rgba(0,0,0,.16),
      0.02em 0.02em 0 rgba(0,0,0,.13),
      0.03em 0.03em 0 rgba(0,0,0,.10),
      0.04em 0.04em 0 rgba(0,0,0,.07),
      0.05em 0.05em 0 rgba(0,0,0,.04);
  }
  .ch .glow{
    position:absolute; inset:-30% -15%;
    background:radial-gradient(closest-side, var(--amber), transparent 70%);
    filter:blur(0.06em);
    opacity:0;
    z-index:0;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .sp{ display:inline-block; width:.22em; flex-shrink:0; }

  /* ---------- motto band ---------- */
  .band{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2rem;
    margin-top:clamp(2.5rem,6vw,4.5rem);
  }
  .motto{
    margin:0;
    font-weight:600;
    letter-spacing:-0.01em;
    font-size:clamp(1.4rem,3.2vw,2.6rem);
    color:var(--fg);
    max-width:16em;
  }

  /* ---------- 3d sculpture ---------- */
  .sculpture{
    width:clamp(120px,14vw,190px);
    height:clamp(110px,13vw,170px);
    perspective:900px;
    flex-shrink:0;
    display:block;
  }
  .tilt{
    width:100%; height:100%;
    transform-style:preserve-3d;
    transform:rotateX(22deg);
  }
  .spin{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation:spin 10s ease-in-out infinite;
  }
  @keyframes spin{
    0%{ transform:rotateY(-26deg); }
    50%{ transform:rotateY(26deg); }
    100%{ transform:rotateY(-26deg); }
  }
  .bar{
    position:absolute;
    bottom:0;
    width:22px;
    transform-style:preserve-3d;
  }
  .bar .f{ position:absolute; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .bar .front{ width:22px; background:var(--amber); transform:translateZ(11px); }
  .bar .back{ width:22px; background:var(--amber-dark); transform:translateZ(-11px) rotateY(180deg); }
  .bar .right{ width:22px; height:22px; background:var(--amber-dark); left:100%; transform-origin:0 50%; transform:rotateY(90deg); }
  .bar .left{ width:22px; height:22px; background:var(--amber-dark); right:100%; transform-origin:100% 50%; transform:rotateY(-90deg); }
  .bar .top{ width:22px; height:22px; top:0; transform-origin:0 0; transform:rotateX(90deg); background:var(--amber-light); }

  /* ---------- corner links ---------- */
  .corner-links{
    position:fixed; right:clamp(1.25rem,4vw,3rem); bottom:clamp(1.25rem,3vw,2rem); z-index:5;
    display:flex; gap:clamp(1.25rem,3vw,2rem);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
  }
  .corner-links a{
    color:var(--dim);
    text-decoration:none;
    transition:color .2s ease;
  }
  .corner-links a:hover{ color:var(--fg); }

  @media (max-width:760px){
    .band{ flex-direction:column; align-items:flex-start; gap:2.5rem; }
    .sculpture{ align-self:flex-end; }
    .corner-links{ position:static; margin-top:4rem; padding:0 5vw 6vw; }
  }
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loader-line"></div></div>
<div class="noise" aria-hidden="true"></div>
<div class="spotlight" id="spotlight" aria-hidden="true"></div>
<div class="tag">Sounddealer.io</div>

<div class="stage">
  <header class="hero" id="hero">
    <h1 id="wordmark" aria-label="Sound Dealer"></h1>
  </header>
  <div class="band">
    <p class="motto">We make noise with purpose.</p>
    <div class="sculpture" aria-hidden="true">
      <div class="tilt"><div class="spin" id="rig"></div></div>
    </div>
  </div>
</div>

<nav class="corner-links">
  <a href="https://stefanoritteri.com">Selected work</a>
  <a href="mailto:stefano@sounddealer.io">Contact</a>
</nav>

<script>
(function(){
  var word = "SOUND DEALER";
  var wordmark = document.getElementById('wordmark');
  var hero = document.getElementById('hero');
  var letters = [];

  for (var i = 0; i < word.length; i++){
    var ch = word[i];
    if (ch === ' '){
      var sp = document.createElement('span');
      sp.className = 'sp';
      sp.setAttribute('aria-hidden', 'true');
      wordmark.appendChild(sp);
      continue;
    }
    var wrap = document.createElement('span');
    wrap.className = 'ch';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML = '<i class="glow"></i><b class="base">' + ch + '</b>';
    wordmark.appendChild(wrap);
    letters.push(wrap);
  }

  function fit(){
    var available = hero.clientWidth;
    wordmark.style.fontSize = '10vw';
    var startPx = parseFloat(getComputedStyle(wordmark).fontSize);
    var rect = wordmark.getBoundingClientRect();
    if (rect.width > 0){
      var scale = available / rect.width;
      wordmark.style.fontSize = (startPx * scale) + 'px';
    }
  }
  fit();
  requestAnimationFrame(function(){ wordmark.style.opacity = 1; });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 120);
  });

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (!reduceMotion){
    var SPEED = 0.7, SPACING = 0.45, AMPL = 10, STRETCH = 0.16;

    function frame(t){
      var time = t / 1000;
      for (var i = 0; i < letters.length; i++){
        var phase = time * SPEED - i * SPACING;
        var wave = Math.sin(phase);
        var ty = wave * AMPL;
        var sy = 1 + wave * STRETCH;
        var sx = 1 - wave * STRETCH * 0.4;
        var el = letters[i];
        el.style.transform = 'translateY(' + ty.toFixed(2) + 'px) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
        el.querySelector('.glow').style.opacity = (Math.abs(wave) * 0.4).toFixed(2);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (canHover){
    var spotlight = document.getElementById('spotlight');
    window.addEventListener('pointermove', function(e){
      var xp = (e.clientX / window.innerWidth) * 100;
      var yp = (e.clientY / window.innerHeight) * 100;
      spotlight.style.setProperty('--x', xp + '%');
      spotlight.style.setProperty('--y', yp + '%');

      if (!reduceMotion){
        var rect = hero.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dx = (e.clientX - cx) / (rect.width / 2);
        var dy = (e.clientY - cy) / (rect.height / 2);
        var rotY = Math.max(-1, Math.min(1, dx)) * 3;
        var rotX = Math.max(-1, Math.min(1, dy)) * -3;
        hero.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
      }
    });
    window.addEventListener('pointerleave', function(){
      hero.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  }

  /* equalizer sculpture */
  var rig = document.getElementById('rig');
  var BAR_X = [0, 30, 60, 90, 120];
  var BASE_H = [55, 95, 70, 110, 60];
  var bars = BAR_X.map(function(x, i){
    var bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.left = x + 'px';
    bar.innerHTML =
      '<i class="f front"></i><i class="f back"></i>' +
      '<i class="f right"></i><i class="f left"></i><i class="f top"></i>';
    rig.appendChild(bar);
    return { el: bar, base: BASE_H[i], phase: i * 0.9 };
  });

  if (!reduceMotion){
    function pulse(t){
      var time = t / 1000;
      for (var i = 0; i < bars.length; i++){
        var b = bars[i];
        var h = b.base + Math.sin(time * 1.6 - b.phase) * (b.base * 0.32);
        b.el.style.height = h + 'px';
        var faces = b.el.querySelectorAll('.front,.back,.right,.left');
        faces.forEach(function(f){ f.style.height = h + 'px'; });
      }
      requestAnimationFrame(pulse);
    }
    requestAnimationFrame(pulse);
  } else {
    bars.forEach(function(b){
      var h = b.base;
      b.el.style.height = h + 'px';
      var faces = b.el.querySelectorAll('.front,.back,.right,.left');
      faces.forEach(function(f){ f.style.height = h + 'px'; });
    });
  }
})();

window.addEventListener('load', function(){
  setTimeout(function(){
    document.getElementById('loader').classList.add('done');
  }, 500);
});
</script>
</body>
</html>
