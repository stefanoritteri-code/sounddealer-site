<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Dealer</title>
<meta name="description" content="Sound Dealer.">
<style>
  :root{
    --bg:#0a0a0a;
    --line:#ece1c6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    overflow:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  svg{ display:block; overflow:visible; }
  #word{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    fill:none;
    stroke:var(--line);
    stroke-linejoin:round;
    stroke-linecap:round;
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="1" result="noise"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
      </filter>
    </defs>
    <text id="word" x="50%" y="50%" text-anchor="middle" dominant-baseline="central" filter="url(#boil)">sounddealer.io</text>
  </svg>
</div>

<script>
(function(){
  var svg = document.getElementById('svg');
  var text = document.getElementById('word');
  var turb = document.getElementById('turb');
  var stage = document.querySelector('.stage');

  function fit(){
    var w = stage.clientWidth;
    var h = window.innerHeight;
    var padding = w * 0.1;
    var available = w - padding;

    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    text.setAttribute('x', w / 2);
    text.setAttribute('y', h / 2);

    text.style.fontSize = (h * 0.32) + 'px';
    var bbox = text.getBBox();
    if (bbox.width > 0){
      var scale = available / bbox.width;
      var newSize = parseFloat(text.style.fontSize) * scale;
      text.style.fontSize = newSize + 'px';
      text.style.strokeWidth = Math.max(2, newSize * 0.014) + 'px';
    }
  }
  fit();

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 120);
  });

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion){
    var seeds = [1, 6, 3, 8, 2, 9, 4, 7, 1];
    var i = 0;
    setInterval(function(){
      i = (i + 1) % seeds.length;
      turb.setAttribute('seed', seeds[i]);
    }, 160);
  }
})();
</script>
</body>
</html>
