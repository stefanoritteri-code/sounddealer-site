<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Dealer</title>
<meta name="description" content="Sound Dealer — music and sound production, London. The company behind Stefano Ritteri's work.">
<style>
  :root{
    --bg:#0c0b09;
    --fg:#f4efe4;
    --dim:#8d867a;
    --rule:#2a2722;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:6vw 6vw 4vw;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:1100px;
  }
  h1{
    margin:0;
    font-size:clamp(3rem, 12vw, 9rem);
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:0.92;
    text-transform:uppercase;
  }
  .rule{
    height:1px;
    background:var(--rule);
    margin:clamp(1.25rem,3vw,2rem) 0;
    width:100%;
  }
  p.lede{
    margin:0 0 clamp(1.5rem,4vw,2.5rem);
    max-width:34em;
    font-size:clamp(1.05rem,1.6vw,1.35rem);
    line-height:1.5;
    color:var(--fg);
    font-weight:400;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:0.6em;
    font-size:clamp(0.95rem,1.3vw,1.1rem);
  }
  a{
    color:var(--fg);
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    padding-bottom:1px;
    transition:border-color .15s ease, color .15s ease;
  }
  a:hover{
    color:var(--fg);
    border-bottom-color:var(--fg);
  }
  .label{
    color:var(--dim);
    font-size:0.85em;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-right:0.6em;
  }
  footer{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:0.5em;
    font-size:0.8rem;
    color:var(--dim);
    letter-spacing:0.03em;
    padding-top:2rem;
  }
  footer a{
    color:var(--dim);
    border-bottom:1px solid transparent;
  }
  footer a:hover{
    color:var(--fg);
    border-bottom-color:var(--dim);
  }
  @media (max-width:480px){
    body{padding:9vw 6vw 6vw;}
  }
</style>
</head>
<body>
<main>
  <h1>Sound Dealer</h1>
  <div class="rule"></div>
  <p class="lede">Music and sound production, based in London. The company behind Stefano Ritteri's work.</p>
  <div class="links">
    <div><span class="label">Selected work</span><a href="https://stefanoritteri.com">stefanoritteri.com</a></div>
    <div><span class="label">Contact</span><a href="mailto:stefano@sounddealer.io">stefano@sounddealer.io</a></div>
  </div>
</main>
<footer>
  <span>Sound Dealer &mdash; <span id="y"></span></span>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
