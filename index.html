<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Dealer</title>
<meta name="description" content="Sound Dealer — music, sound, and the systems that make them. Stefano Ritteri's studio.">
<style>
  :root{
    --bg:#16130f;
    --fg:#ede7da;
    --dim:#948c7c;
    --rule:#332d24;
    --amber:#ff9b3d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow-x:hidden;
  }

  .noise{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    opacity:.035; mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
  .spotlight{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(640px circle at var(--x,50%) var(--y,10%), rgba(255,155,61,.10), transparent 62%);
  }

  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:6vw 5vw 3vw;
    perspective:1600px;
  }

  .hero{
    width:100%;
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }
  h1#wordmark{
    margin:0;
    width:100%;
    display:flex;
    flex-wrap:nowrap;
    white-space:nowrap;
    font-weight:800;
    letter-spacing:-0.03em;
    text-transform:uppercase;
    line-height:1;
    color:var(--fg);
    opacity:0;
    transition:opacity .8s ease;
  }
  .ch{
    position:relative;
    display:inline-block;
    transform-origin:50% 100%;
    will-change:transform;
  }
  .ch .base{
    position:relative;
    z-index:1;
    text-shadow:
      0.01em 0.01em 0 rgba(0,0,0,.16),
      0.02em 0.02em 0 rgba(0,0,0,.13),
      0.03em 0.03em 0 rgba(0,0,0,.10),
      0.04em 0.04em 0 rgba(0,0,0,.07),
      0.05em 0.05em 0 rgba(0,0,0,.04);
  }
  .ch .glow{
    position:absolute; inset:-30% -15%;
    background:radial-gradient(closest-side, var(--amber), transparent 70%);
    filter:blur(0.06em);
    opacity:0;
    z-index:0;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .sp{ display:inline-block; width:.22em; flex-shrink:0; }

  .content{
    max-width:640px;
    margin-top:clamp(2.5rem,7vw,4.5rem);
  }
  .lede{
    margin:0 0 .5rem;
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.3rem,2.6vw,2rem);
    line-height:1.3;
    color:var(--fg);
  }
  .sub{
    margin:0 0 clamp(2.25rem,5vw,3.25rem);
    color:var(--dim);
    font-size:clamp(1rem,1.3vw,1.15rem);
    line-height:1.55;
    max-width:32em;
  }

  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(1.75rem,4vw,3.5rem);
  }
  .meta-link{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:.4em;
    padding-bottom:.5em;
    text-decoration:none;
    color:var(--fg);
  }
  .meta-label{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .meta-value{ font-size:1.05rem; }
  .meta-link::after{
    content:""; position:absolute; left:0; bottom:0; height:1px; width:100%;
    background:var(--rule);
  }
  .meta-link::before{
    content:""; position:absolute; left:0; bottom:0; height:1px; width:0;
    background:var(--amber);
    transition:width .4s cubic-bezier(.2,.7,.2,1);
  }
  .meta-link:hover::before{ width:100%; }

  footer{
    margin-top:auto;
    padding-top:clamp(3rem,7vw,5rem);
    display:flex;
    align-items:baseline;
    gap:.6em;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.72rem;
    letter-spacing:.06em;
    color:var(--dim);
  }
  footer .dot{ opacity:.5; }

  @media (max-width:640px){
    .stage{ padding:12vw 6vw 8vw; }
    .meta{ gap:1.5rem; }
  }
</style>
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<div class="spotlight" id="spotlight" aria-hidden="true"></div>
<div class="stage">
  <header class="hero" id="hero">
    <h1 id="wordmark" aria-label="Sound Dealer"></h1>
  </header>
  <div class="content">
    <p class="lede">Music, sound, and the systems that make them.</p>
    <p class="sub">Stefano Ritteri's studio &mdash; composer, and the tools he builds along the way.</p>
    <nav class="meta">
      <a class="meta-link" href="https://stefanoritteri.com">
        <span class="meta-label">Selected&nbsp;work</span>
        <span class="meta-value">stefanoritteri.com</span>
      </a>
      <a class="meta-link" href="mailto:stefano@sounddealer.io">
        <span class="meta-label">Contact</span>
        <span class="meta-value">stefano@sounddealer.io</span>
      </a>
    </nav>
  </div>
  <footer>
    <span>Sound Dealer &mdash; <span id="y"></span></span>
    <span class="dot">&middot;</span>
    <span>London</span>
  </footer>
</div>

<script>
(function(){
  var word = "SOUND DEALER";
  var wordmark = document.getElementById('wordmark');
  var hero = document.getElementById('hero');
  var letters = [];

  for (var i = 0; i < word.length; i++){
    var ch = word[i];
    if (ch === ' '){
      var sp = document.createElement('span');
      sp.className = 'sp';
      sp.setAttribute('aria-hidden', 'true');
      wordmark.appendChild(sp);
      continue;
    }
    var wrap = document.createElement('span');
    wrap.className = 'ch';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML = '<i class="glow"></i><b class="base">' + ch + '</b>';
    wordmark.appendChild(wrap);
    letters.push(wrap);
  }

  function fit(){
    var available = hero.clientWidth;
    wordmark.style.fontSize = '10vw';
    var startPx = parseFloat(getComputedStyle(wordmark).fontSize);
    var rect = wordmark.getBoundingClientRect();
    if (rect.width > 0){
      var scale = available / rect.width;
      wordmark.style.fontSize = (startPx * scale) + 'px';
    }
  }
  fit();
  requestAnimationFrame(function(){ wordmark.style.opacity = 1; });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 120);
  });

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (!reduceMotion){
    var SPEED = 0.7, SPACING = 0.45, AMPL = 10, STRETCH = 0.16;

    function frame(t){
      var time = t / 1000;
      for (var i = 0; i < letters.length; i++){
        var phase = time * SPEED - i * SPACING;
        var wave = Math.sin(phase);
        var ty = wave * AMPL;
        var sy = 1 + wave * STRETCH;
        var sx = 1 - wave * STRETCH * 0.4;
        var el = letters[i];
        el.style.transform = 'translateY(' + ty.toFixed(2) + 'px) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
        el.querySelector('.glow').style.opacity = (Math.abs(wave) * 0.4).toFixed(2);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (canHover){
    var spotlight = document.getElementById('spotlight');
    window.addEventListener('pointermove', function(e){
      var xp = (e.clientX / window.innerWidth) * 100;
      var yp = (e.clientY / window.innerHeight) * 100;
      spotlight.style.setProperty('--x', xp + '%');
      spotlight.style.setProperty('--y', yp + '%');

      if (!reduceMotion){
        var rect = hero.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dx = (e.clientX - cx) / (rect.width / 2);
        var dy = (e.clientY - cy) / (rect.height / 2);
        var rotY = Math.max(-1, Math.min(1, dx)) * 3;
        var rotX = Math.max(-1, Math.min(1, dy)) * -3;
        hero.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
      }
    });
    window.addEventListener('pointerleave', function(){
      hero.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  }
})();
document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
